services:
  - type: web
    name: surtidor-valencia
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node backend/server.js
    healthCheckPath: /api/surtidores
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
