<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surtidor Valencia — Iniciar Sesión</title>
  <meta name="description" content="Sistema de gestión integral para estaciones de servicio en Valencia. Ingrese sus credenciales para acceder." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">

  <div class="login-bg">
    <div class="login-bg__orb login-bg__orb--1"></div>
    <div class="login-bg__orb login-bg__orb--2"></div>
    <div class="login-bg__orb login-bg__orb--3"></div>
  </div>

  <main class="login-wrapper">
    <div class="login-card">
      <!-- Logo / Branding -->
      <div class="login-card__header">
        <div class="login-logo">
          <img src="img/logo.png" alt="Surtidor Valencia" class="login-logo__img" />
        </div>
        <p class="login-card__subtitle">Gestión de Estaciones de Servicio</p>
      </div>

      <!-- Formulario -->
      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon">✉</span>
            <input
              id="email"
              class="form-input"
              type="email"
              placeholder="admin@surtidor.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              id="password"
              class="form-input"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" id="togglePassword" class="input-toggle" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>

        <div id="loginError" class="form-error" aria-live="polite" hidden></div>

        <button id="loginBtn" type="submit" class="btn btn--primary btn--full">
          <span class="btn__text">Ingresar al Sistema</span>
          <span class="btn__spinner" hidden></span>
        </button>
      </form>

      <p class="login-card__footer">
        © 2026 Surtidor Valencia · Todos los derechos reservados
      </p>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
